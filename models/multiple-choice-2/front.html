<div class="note front question-card {{Tags}}">
    <div class="body question">{{Question}}</div>
    <div class="body question-options">
        <ol type="A">
            <li value="1" data-choice="A">{{Option A}}</li>
            <li value="2" data-choice="B">{{Option B}}</li>
            {{#Option C}}<li value="3" data-choice="C">{{Option C}}</li>{{/Option C}}
            {{#Option D}}<li value="4" data-choice="D">{{Option D}}</li>{{/Option D}}
        </ol>
    </div>
</div>
