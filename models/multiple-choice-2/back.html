    <script>
        // Persistence strategy based on Simon Lammer's MIT-licensed anki-persistence:
        // https://github.com/SimonLammer/anki-persistence
        if (typeof window.Persistence === "undefined") {
            const prefix = "github.com/SimonLammer/anki-persistence/";
            const makeStore = storage => ({
                isAvailable: () => storage.available,
                getItem(key) {
                    const value = storage.get(key || "_default");
                    return value == null ? null : JSON.parse(value);
                },
                setItem(key, value) {
                    if (value === undefined) { value = key; key = "_default"; }
                    storage.set(key || "_default", JSON.stringify(value));
                },
                clear() { storage.clear(); }
            });
            let store = { available: false };
            try {
                if (typeof window.sessionStorage === "object") {
                    store = {
                        available: true,
                        get: key => window.sessionStorage.getItem(prefix + key),
                        set: (key, value) => window.sessionStorage.setItem(prefix + key, value),
                        clear() {
                            Object.keys(window.sessionStorage).filter(key => key.startsWith(prefix))
                                .forEach(key => window.sessionStorage.removeItem(key));
                        }
                    };
                }
            } catch (_) {}
            window.Persistence = makeStore(store);
            if (!window.Persistence.isAvailable()) {
                const persistentWindow = window.py && typeof window.py === "object" ? window.py :
                    (window.qt && typeof window.qt === "object" ? window.qt : null);
                if (persistentWindow) {
                    const state = persistentWindow[prefix] || (persistentWindow[prefix] = {});
                    window.Persistence = {
                        isAvailable: () => true,
                        getItem: key => state[key || "_default"] ?? null,
                        setItem(key, value) {
                            if (value === undefined) { value = key; key = "_default"; }
                            state[key || "_default"] = value;
                        },
                        clear() { Object.keys(state).forEach(key => delete state[key]); }
                    };
                }
            }
        }
    </script>
<div class="note back choice-answer-card {{Tags}}" data-mc2-back>
    {{FrontSide}}
    <hr id="answer" class="answer-divider choice-answer-anchor">
    <div id="choice-answer-key" hidden>{{text:Correct Answers}}</div>
    <div class="body question-results" data-mc2-feedback hidden></div>
    {{#Explanation}}

    {{#Source}}
    <div class="body question-results question-source small">{{Source}}</div>
    {{/Source}}
    <script>
        (function () {
            const backs = document.querySelectorAll("[data-mc2-back]");
            const back = backs[backs.length - 1];
            if (!back) return;
            const key = back.querySelector("#choice-answer-key");
            const options = Array.from(back.querySelectorAll(".question-options [data-choice]"));
            const raw = key.textContent.trim().toUpperCase();
            const correct = new Set(raw.split(/[\s,]+/).filter(Boolean));
            const available = new Set(options.map(option => option.dataset.choice));
            const feedback = back.querySelector("[data-mc2-feedback]");
            const answerColoring = "all";
            if (!correct.size || Array.from(correct).some(letter => !available.has(letter))) {
                feedback.hidden = false;
                feedback.textContent = "Check the Correct Answers field. Enter letters such as A or A,C.";
                try { Persistence.setItem("mc2", null); } catch (_) {}
                return;
            }

            const stateKey = "mc2";
            let saved = null;
            try { saved = Persistence.getItem(stateKey); } catch (_) {}
            const selected = new Set(saved?.selected || []);
            if (saved && Array.isArray(saved.order)) {
                const byLetter = new Map(options.map(option => [option.dataset.choice, option]));
                const list = options[0]?.parentElement;
                if (list) saved.order.filter(letter => byLetter.has(letter)).forEach(letter => list.appendChild(byLetter.get(letter)));
            }
            options.forEach(option => {
                const letter = option.dataset.choice;
                const isCorrect = correct.has(letter);
                const wasSelected = selected.has(letter);
                const highlightCorrect = isCorrect && (answerColoring === "all" || !wasSelected);
                const highlightWrong = !isCorrect && (answerColoring === "all" || wasSelected);
                option.classList.toggle("correct-answer", highlightCorrect);
                option.classList.toggle("wrong-answer", highlightWrong);
                option.classList.toggle("missed-answer", !wasSelected && isCorrect);
                const input = option.querySelector("input");
                if (input) {
                    input.checked = wasSelected;
                    input.disabled = true;
                }
            });
            feedback.hidden = true;
            // Clear only after the back has consumed the front-side selection.
            try { Persistence.setItem(stateKey, null); } catch (_) {}
        })();
    </script>
</div>
