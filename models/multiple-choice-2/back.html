    <script>
        if (typeof window.Persistence === "undefined") {
            const prefix = "github.com/cdmoro/anki-material-notes/multiple-choice/";
            let storage;
            try {
                storage = window.sessionStorage;
            } catch (_) {}
            if (!storage) {
                const host = window.py || window.qt;
                if (host) {
                    const state = host[prefix] || (host[prefix] = {});
                    storage = {
                        getItem: key => state[key] ?? null,
                        setItem: (key, value) => { state[key] = value; }
                    };
                }
            }
            if (storage) window.Persistence = {
                getItem: key => JSON.parse(storage.getItem(prefix + key) ?? "null"),
                setItem: (key, value) => storage.setItem(prefix + key, JSON.stringify(value))
            };
        }
    </script>
<div class="note back choice-answer-card {{Tags}}" data-mc2-back>
    {{FrontSide}}
    <div id="choice-answer-key" hidden>{{text:Correct Answers}}</div>
    <div class="body question-results" data-mc2-feedback hidden></div>
    {{#Explanation}}
    <div class="body question-results">
        <div class="subtitle text-sm">Explanation</div>
        <div class="text-md">{{Explanation}}</div>
    </div>
    {{/Explanation}}
    {{#Source}}
    <div class="body question-results question-source small">{{Source}}</div>
    {{/Source}}
    <script>
        (function () {
            const backs = document.querySelectorAll("[data-mc2-back]");
            const back = backs[backs.length - 1];
            if (!back || back.dataset.mc2FeedbackPalette) return;
            const tagsRaw = "{{Tags}}";
            const reservedConfig = /^note-(?:layout|label-option|label-options|answer-feedback|feedback-palette|feedback-symbols|shuffle-options)(?:-|$)/;
            const tagTokens = Array.from(new Set([
                ...back.classList,
                ...tagsRaw.trim().split(/\s+/).filter(Boolean),
            ].map(token => token.replace(/^Material::/, ""))));
            const matches = tagTokens.map(token => /^note-answer-feedback-([1-3])$/.exec(token))
                .filter(Boolean);
            Array.from(back.classList).filter(token => reservedConfig.test(token.replace(/^Material::/, "")))
                .forEach(token => back.classList.remove(token));
            const defaults = back.querySelector("[data-mc2-front]")?.mc2Defaults ?? {};
            const palettes = ["green-red", "blue-orange", "monochrome"];
            const paletteTags = tagTokens.map(token => /^note-feedback-palette-(.+)$/.exec(token)?.[1])
                .filter(value => palettes.includes(value));
            const defaultPalette = palettes.includes(defaults.feedbackPalette) ? defaults.feedbackPalette : palettes[0];
            back.dataset.mc2FeedbackPalette = paletteTags.length === 1
                ? paletteTags[0] : defaultPalette;
            const showFeedbackSymbols = Boolean(back.querySelector(".mc2-show-feedback-symbols"));
            const key = back.querySelector("#choice-answer-key");
            const options = Array.from(back.querySelectorAll(".question-options [data-choice]"));
            const raw = key.textContent;
            const answerPattern = /^\s*(?:[A-Z]|\d+)(?:(?:\s*,\s*|\s+)(?:[A-Z]|\d+))*\s*$/i;
            const tokens = raw.trim() && answerPattern.test(raw)
                ? raw.toUpperCase().match(/[A-Z]|\d+/g) || [] : [];
            const correct = new Set(tokens.map(token => {
                if (/^[A-Z]$/.test(token)) return token;
                const number = Number(token);
                return number >= 1 && number <= 10 ? String.fromCharCode(64 + number) : null;
            }).filter(choice => choice && options.some(option => option.dataset.choice === choice)));
            const feedback = back.querySelector("[data-mc2-feedback]");
            const feedbackModes = ["correct-and-errors", "all", "mistakes"];
            const defaultFeedback = feedbackModes.includes(defaults.answerFeedback)
                ? defaults.answerFeedback : feedbackModes[0];
            const answerColoring = matches.length === 1
                ? feedbackModes[Number(matches[0][1]) - 1]
                : defaultFeedback;
            if (!correct.size) {
                feedback.hidden = false;
                feedback.textContent = "Check Correct Answers. Enter letters (A or A,C) or option numbers (1 or 1,4), separated by commas or spaces.";
                try { Persistence.setItem("mc2", null); } catch (_) {}
                return;
            }

            const stateKey = "mc2";
            let saved = null;
            try { saved = Persistence.getItem(stateKey); } catch (_) {}
            const selected = new Set(saved?.selected || []);
            if (saved && Array.isArray(saved.order)) {
                const byLetter = new Map(options.map(option => [option.dataset.choice, option]));
                const list = options[0]?.parentElement;
                if (list) saved.order.filter(letter => byLetter.has(letter)).forEach(letter => list.appendChild(byLetter.get(letter)));
            }
            options.forEach(option => {
                const letter = option.dataset.choice;
                const isCorrect = correct.has(letter);
                const wasSelected = selected.has(letter);
                const highlightCorrect = isCorrect && (answerColoring !== "mistakes" || !wasSelected);
                const highlightWrong = !isCorrect && (answerColoring === "all" || wasSelected);
                option.classList.toggle("correct-answer", highlightCorrect);
                option.classList.toggle("wrong-answer", highlightWrong);
                option.classList.toggle("missed-answer", !wasSelected && isCorrect);
                if (showFeedbackSymbols && (highlightCorrect || highlightWrong)) {
                    const symbol = document.createElement("span");
                    symbol.className = "mc2-feedback-symbol";
                    symbol.setAttribute("role", "img");
                    symbol.setAttribute("aria-label", highlightCorrect ? "Correct" : "Incorrect");
                    option.append(symbol);
                }
                const input = option.querySelector("input");
                if (input) {
                    input.checked = wasSelected;
                    input.disabled = true;
                }
            });
            feedback.hidden = true;
            // Clear only after the back has consumed the front-side selection.
            try { Persistence.setItem(stateKey, null); } catch (_) {}
        })();
    </script>
</div>
